# HTTP — redirect to HTTPS when certs exist; otherwise serve HTTP (bootstrap).
# Place fullchain.pem + privkey.pem in deploy/certs/ and switch to the HTTPS block.
#
# Use Docker embedded DNS + variables so api/web IPs re-resolve after recreate
# (plain `upstream { server api:8000; }` freezes the IP at nginx start → 502).

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Let's Encrypt / ACME (if using certbot on host mounting challenge dir later)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # API + admin + static Django (WhiteNoise also serves /static/)
    location /api/ {
        set $seeds_api api:8000;
        proxy_pass http://$seeds_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Kommo Digital Pipeline expects /webhook/<id> (same shape as n8n)
    location /webhook/ {
        set $seeds_api api:8000;
        proxy_pass http://$seeds_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        set $seeds_api api:8000;
        proxy_pass http://$seeds_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        set $seeds_api api:8000;
        proxy_pass http://$seeds_api;
        proxy_set_header Host $host;
    }

    # SPA
    location / {
        set $seeds_web web:80;
        proxy_pass http://$seeds_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

